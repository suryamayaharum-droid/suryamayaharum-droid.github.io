<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Processo e projeto | Tattoo Studio 23 em Salvador</title><meta name="description" content="Entenda como funciona o processo no Studio 23: conversa inicial, criação visual, execução e orientação pós-sessão."><link rel="stylesheet" href="/assets/site.css"><script defer src="/assets/site.js"><\/script></head><body><header class="top topin" role="banner"><div class="shell"><a href="/" class="brand"><em>Studio</em> 23</a><button class="menu" aria-label="Menu" aria-expanded="false">☰</button><nav id="primary-nav" role="navigation" aria-label="Navegação principal"><div class="nav-links"><a href="/portfolio/">Portfólio</a><a href="/biblioteca/">Biblioteca</a><a href="/processo/" class="current">Processo</a><a href="/faq/">FAQ</a><a href="/agendar/" class="btn primary">Agendar</a></div></nav></div></header><main><section class="hero"><div class="shell"><div><span class="label">Processo</span><h1 class="display">Da ideia à peça final</h1><p class="lead">O Studio 23 trabalha com processo claro, respeitoso e visualmente orientado. Cada passo é pensado para que a obra tenha sentido, personalidade e leitura forte no corpo.</p><div class="actions"><a href="/agendar/" class="btn primary">Iniciar Projeto</a><a href="/portfolio/" class="btn">Ver Portfólio</a></div></div></div></section><section class="section"><div class="shell"><div class="process-grid"><div class="process-step"><div class="step-no">01</div><h3>Conversa</h3><p>Você manda a ideia, a memória, a referência, o local ou a sensação que quer transformar em arte. Isso é o ponto de partida da conversa.</p></div><div class="process-step"><div class="step-no">02</div><h3>Diagnóstico</h3><p>Olhamos o corpo, a leitura visual, a técnica ideal e a melhor direção para a peça. Nem toda ideia precisa seguir o mesmo caminho.</p></div><div class="process-step"><div class="step-no">03</div><h3>Criação</h3><p>Desenhamos, ajustamos e refinamos. O processo pode incluir estudo de composição, trama, volume e organização de elementos.</p></div><div class="process-step"><div class="step-no">04</div><h3>Execução</h3><p>A peça é feita com dedicação, observação e técnica. A execução final é pensada para dar ao desenho presença, consistência e equilíbrio.</p></div></div></div></section><section class="section" style="background:rgba(4,4,4,.18);"><div class="shell"><div style="max-width:700px;margin:0 auto;text-align:center;"><span class="label">O que ele considera</span><h2 class="title" style="margin-top:.8rem;">Tudo que define a melhor proposta</h2></div><div class="quote-grid"><div class="quote-card"><p>“O mais importante não é só a imagem, mas a intenção por trás dela. A tatuagem precisa fazer sentido no corpo e na vida da pessoa.”</p><strong>Studio 23</strong></div><div class="quote-card"><p>“A arte precisa ser legível, confortável e coerente. O desenho é um projeto que funciona no corpo e no tempo.”</p><strong>Direção visual</strong></div><div class="quote-card"><p>“Não é só desenho: é lugar, energia, presença, gesto e memória. A peça precisa viver com a pessoa.”</p><strong>Processo criativo</strong></div></div><div class="mini-cta"><p>Se você já tem uma ideia, uma referência ou só sente uma direção artística, é o começo perfeito.</p><a href="/agendar/" class="btn primary">Agendar conversa</a></div></div></section></main><footer class="footer"><div class="shell foot"><span>© <span id="year"></span> Tattoo Studio 23 · Arte Harum · Salvador</span><span><a href="https://wa.me/5571994091575?text=Ol%C3%A1%20Studio%2023">WhatsApp</a> · <a href="/privacidade/">Privacidade</a></span></div></footer></body></html>
